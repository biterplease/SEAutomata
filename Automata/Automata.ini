; Automata - Server Configuration
; Place this file in the mod's root directory (next to modinfo.sbm)

[Session]
; Update interval for session component (ticks, 60 = 1 second)
UpdateInterval=100

[BlockLimits]
; Maximum number of scheduler blocks per player (-1 = unlimited)
MaxSchedulersPerPlayer=1
; Maximum number of scheduler blocks per faction (-1 = unlimited)
MaxSchedulersPerFaction=5
; Maximum number of drone controller blocks per player (-1 = unlimited)
MaxDroneControllersPerPlayer=10
; Maximum number of drone controller blocks per faction (-1 = unlimited)
MaxDroneControllersPerFaction=50

[Pathfinding]
; Enable/disable pathfinding methods (true/false)
AllowDirectPathfinding=true
AllowSensors=true
AllowObstacleAvoidance=true
AllowSimpleRepositioning=true
; Lazy Theta* search (route planner stage 3) when the straight line and the memory find no way
AllowLazyTheta=true
; m around the stretch that failed; most cells per search; most ms per search
ThetaSearchRadius=300
ThetaMaxExpansions=3000
ThetaMaxMs=15
AllowDStarLite=false
; Gravity-aware pathfinding
UseGravityAwarePathing=true
; Minimum distance between waypoints in meters
MinWaypointDistance=5.0
; Maximum distance between waypoints in meters
MaxWaypointDistance=15.0
; Maximum repositioning attempts when stuck
MaxRepositionAttempts=10
; Step size for repositioning in meters
RepositionStep=10.0
; Minimum altitude buffer above ground (meters)
MinAltitudeBuffer=20.0
; Maximum pathfinding nodes to evaluate
MaxPathNodes=1000
; Maximum time to spend on pathfinding (milliseconds)
MaxPathfindingTimeMs=50
; Simulated instruments (no real raycasts / sensor queries), functional + switched on, seen from where each block is
; mounted. Sensors: short range around the sensor (their own range settings don't matter). Cameras: long range along
; their facing (90-degree square cone; six cameras cover every direction). Off: sensors = that range all around the
; hull; cameras = one simulated camera on the front of the hull looking forward.
RequireCamerasForPathfinding=true
RequireSensorsForPathfinding=true
; Camera sight (m)
CameraRange=1500
; Sensor sight (m)
SimulatedSensorRange=100
; Look-ahead rays per tick shared by all drones (5 per check)
RaysPerTick=60
; Replan when something appears on the way (false: the drone stops and the task fails)
AllowRepathing=true
; Climb over terrain on planets
UsePlanetAwarePathfinding=true
; m kept between the hull and obstacles by route checks (ray margin, room to turn)
ObstacleClearance=3.0
; Planets: stretches longer than ArcMinDistance (m) follow the planet curve as straight chords at least ArcStep (m) long
ArcMinDistance=300
ArcStep=200
; m a chord may sag below its ends (longer chords: fewer, straighter lines); chord ends are lifted to clear the terrain
ArcSag=25
; Docking / undocking in tight spaces: m kept around the hull in the entry corridor (hangars, bays)
DockClearance=0.25
; m: tried next when no corridor fits with DockClearance (tight doors): half the corridor speed, line held within half of it
DockClearanceMin=0.1
; m from the connector the corridor is searched to a point with room to turn
DockCorridorMaxLength=40
; Shared memory of the ways drones have flown (route planner stage 2), saved with the world
UsePathMemory=true
; Most remembered points (least recently used go first); hours a remembered link may go unused
PathMemoryMaxNodes=4000
PathMemoryMaxAgeHours=24
; Flight lanes unused this many minutes are dropped
FlightLaneExpirationMinutes=240

[Drone]
; Maximum job task timeout (seconds, 10-600). Each drone sets its own in the terminal (Task timeout, 0 up to this).
; A task fails after that long (navigation: that long without getting closer).
TaskTimeoutSeconds=15
; Debug overlays (observation area, navigation targets) switch off after this many seconds. 10-3600
DebugDrawTimeoutSeconds=600
; Default power monitoring settings (can be overridden per block)
DefaultMonitorHydrogen=false
DefaultMonitorBattery=false
; Default hydrogen thresholds (percentage)
DefaultHydrogenRefuelThreshold=25.0
DefaultHydrogenOperationalThreshold=50.0
; Default battery thresholds (percentage)
DefaultBatteryRefuelThreshold=20.0
DefaultBatteryOperationalThreshold=40.0
; Minimum/Maximum power thresholds allowed
MinPowerThreshold=5.0
MaxPowerThreshold=95.0
; Full rescan of the drone's blocks (seconds, min 60). Adding / removing blocks triggers a rescan anyway.
ComponentCheckIntervalSeconds=600
; Home connector / beacon lists: only the drone owner's and the owner's faction's blocks are listed.
; How often a drone's list may refresh on its own (seconds)...
ConnectorScanIntervalSeconds=60
; ...only if the drone moved this far since the last scan (metres)...
ConnectorScanMinMoveMeters=250
; ...or the list is older than this (seconds)
ConnectorScanMaxAgeSeconds=600
; Minimum time between player-initiated scans per drone (seconds, min 5)
ConnectorManualScanIntervalSeconds=60
; Automatic list radius around the drone controller (metres, 100-5000)
ConnectorScanRadius=1000
; "Add to list" by name: search radius, and the furthest a home connector / anchor may be (metres)
ConnectorNameSearchRadius=15000
; Minimum time between "Add to list" searches per drone (seconds)
ConnectorNameSearchIntervalSeconds=10
; Combat handover: AI Defensive detections farther than this (m) from the drone are ignored (vanilla limit 2000)
CombatMaxDetectionRange=2000
; Weld work sites: where the drone's bounding box doesn't fit the way in, check its real shape (its blocks merged
; into a few boxes): a welder snout reaches between built neighbours the box can't
WeldUseDroneShape=true
; Weld work sites: built blocks of the target grid in the way are checked against their real shape (rays against the
; physics: slopes, panels) instead of as full cubes
WeldUseNeighbourShapes=true

[ConstructionComputer]
; Stand-alone drones: blocks taken per scan of the observation area (5x5x5 = 125)
DroneMaxJobsPerScan=125
; Stand-alone drones: seconds between observation-area scans while idle
DroneScanIntervalSeconds=30
; Construction computer blocks: jobs published at once (announced or on hold, not awarded yet)
MaxPublishedJobs=10
; Stand-alone drones: give up on a block after this many seconds of work

[Orchestrator]
; Auctions open at once; further job announcements wait in the orchestrator's queue
MaxConcurrentAuctions=10
; An auction without a single bid this long: the announcer is told (JOB_ANNOUNCEMENT_FAILED) and the auction dropped
NoBidTimeoutSeconds=60
; How long the announcer then holds that job before announcing it again
FailedJobHoldSeconds=60

[ScoutPointer]
; Industrial designator order marker until the orchestrator confirms it (R,G,B or #RRGGBB)
PendingGpsColor=255,210,0
; Marker once every job of the order has a drone
ConfirmedGpsColor=40,220,60
; Hostile designator markers (combat jobs, to come)
CombatGpsColor=139,0,0
; An order not confirmed (a drone with the Ore scout profile for each of its jobs) this many seconds is cancelled
ConfirmTimeoutSeconds=10

[Mining]
; Voxel cells (32 m) one ore scan reads per update (every 10 ticks): the CPU cap of scanning
ScanCellsPerUpdate=8
; Ore scans cover at most this radius (m), whatever the ore detector's range
MaxScanRadius=300
; Same ore found within this distance (m) of a known deposit is that deposit
DepositMergeMeters=50
; Deposits one mining surveyor keeps (the farthest go first)
MaxDepositsPerSurveyor=500
; Mining jobs a surveyor has published (not awarded yet) at once
MaxPublishedJobs=5
; Seconds between a surveyor's scans with its own ore detector
SurveyorScanIntervalSeconds=120
; Seconds between a surveying drone's scans (it must also have moved half a scan radius)
DroneSurveyIntervalSeconds=10
; Temporary GPS markers a surveyor shows its owner (nearest deposits first)
MaxGpsMarkers=30

[SchedulerBounds]
; Maximum number of targets to track
MaxTargetLimit=100
; Maximum blocks to scan per update
PerScanLimit=100
; Maximum tasks to assign per batch
MaxTaskAssignmentPerBatch=10
; Delay between scans when on standby (ticks)
ScanDelayTicks=600
; Interval for error recovery attempts (ticks)
ErrorRecoveryIntervalTicks=300
; Maximum consecutive errors before critical failure
MaxConsecutiveErrors=3
; Interval for drone maintenance/cleanup (ticks)
MaintenanceIntervalTicks=300
; Gameplay frames an orchestrator collects bids before assigning (min 60; longer while pooling drones for a big job)
BidCollectionWindowTicks=300
; Gameplay frames a construction computer holds a block back after a drone aborted / declined it
BidBlacklistCooldownTicks=3600

[SchedulerBounds.StateUpdateIntervalTicks]
; Update intervals for different scheduler states (ticks)
Initializing=600
Error=600
Standby=600
Scanning=60
Assigning=60

[DroneNetwork]
; Enable network status broadcasting
AllowNetworkBroadcasting=true
; Default antenna range for status updates (meters)
DefaultAntennaRange=1000.0
; Update rate for network broadcasts (seconds)
NetworkUpdateRate=10.0
; How often schedulers update their antenna cache (ticks)
SchedulerAntennaCacheUpdateIntervalTicks=60
; Maximum messages to read per scheduler update
SchedulerMessageReadLimit=50
; How long messages live in the queue (ticks)
MessageRetentionTicks=600
; How often to clean up old messages (ticks)
MessageCleanupIntervalTicks=600
; Message serialization mode: XML or ProtoBuf
MessageSerializationMode=ProtoBuf

[Logging]
; Log level: Verbose, Info, Debug, Warning, Error
LogLevel=Error|Warning
; Enable specific logging categories
LogPathfinding=false
LogDroneNetwork=true
LogDroneOrders=true

; Legacy sections for compatibility (will be removed in future versions)
[Performance]
; These settings have been moved to their respective sections
AIUpdateInterval=10
PowerCheckInterval=180
BroadcastInterval=600

[Safety]
; Maximum consecutive errors before emergency stop
MaxConsecutiveErrors=3